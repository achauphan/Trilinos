name: Nightly
run-name: Nightly Pipeline (#${{ github.run_number }})

on:
  schedule:
    - cron: '40 21 * * *' # 9:40 PM
      timezone: "America/Denver"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch that is used for nightly builds"
        required: true
        type: string
        default: "develop"

permissions:
  contents: read

jobs:
  cuda-kokkos-bounds-check:
    if: ${{ github.repository == 'trilinos/Trilinos' }}
    uses: ./.github/workflows/ci.yml
    with:
      target-runner-labels: "['self-hosted', 'cuda-12.4.1-gcc-12.3.0-openmpi-4.1.6', '20260903', 'gpu:A100']"
      image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi8-cuda-12.4.1-gcc-12.3.0-openmpi-4.1.6:20260903
      genconfig-string: "rhel_cuda-12-gcc-openmpi_debug_static_Ampere80_no-asan_complex_no-fpic_mpi_pt_no-rdc_no-uvm_deprecated-on_all"
      target-branch: ${{ inputs.target_branch }}
      cdash-track: "Nightly"
      dashboard-build-name: ${AT2_IMAGE}_release_static_bounds-check${{ case(inputs.target_branch == 'develop', '', format('_{0}', inputs.target_branch)) }}
      max-cores-allowed: 56
      num-concurrent-tests: 112
      slots-per-gpu: 8

  kokkos-integration-hip:
    if: ${{ github.repository == 'trilinos/Trilinos' }}
    uses: ./.github/workflows/ci.yml
    with:
      target-runner-labels: "['self-hosted', 'rocm-6.2.1-openblas-0.3.28-openmpi-4.1.5-zen3-gfx90a']"
      image: "unknown"
      genconfig-string: "rhel_rocm-clang-openmpi_release_static_AMDgfx90a_no-asan_complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_kokkos-integration"
      target-branch: ${{ inputs.target_branch }}
      cdash-track: "Nightly"
      dashboard-build-name: rocm-6.2.1-openblas-0.3.28-openmpi-4.1.5-gfx90a_release_static_kokkos-integration-hip${{ case(inputs.target_branch == 'develop', '', format('_{0}', inputs.target_branch)) }}
      skip-create-packageenables: true
      extra-pr-driver-args: --extra-configure-args=-C;${GITHUB_WORKSPACE}/packages/framework/cmake-fragments/kokkos-integration/hip.cmake
      max-cores-allowed: 128
      num-concurrent-tests: 16
      slots-per-gpu: 8
      setup-commands: |
        source /spack/share/spack/setup-env.sh
        spack env activate my_env

  address-sanitizer:
    if: ${{ github.repository == 'trilinos/Trilinos' }}
    uses: ./.github/workflows/ci.yml
    with:
      target-runner-labels: "['self-hosted', 'clang-19.1.7-openmpi-4.1.6', '20260903']"
      image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi9-clang-19.1.7-openmpi-4.1.6:20260903
      genconfig-string: "rhel_clang-openmpi_debug_shared_no-kokkos-arch_asan_no-complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_all"
      target-branch: ${{ inputs.target_branch }}
      cdash-track: "Nightly"
      dashboard-build-name: ${AT2_IMAGE}_debug_shared_address-sanitizer${{ case(inputs.target_branch == 'develop', '', format('_{0}', inputs.target_branch)) }}
      max-cores-allowed: 29
      num-concurrent-tests: 16
      extra-pr-driver-args: --extra-configure-args=-D;CTEST_TEST_TIMEOUT=1200

  coverage-check:
    if: ${{ github.repository == 'trilinos/Trilinos' }}
    uses: ./.github/workflows/ci.yml
    with:
      target-runner-labels: "['self-hosted', 'gcc-12.3.0-openmpi-4.1.6', '20260903']"
      image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi8-gcc-12.3.0-openmpi-4.1.6:20260903
      genconfig-string: "rhel8_gcc-openmpi_debug-coverage_shared_no-kokkos-arch_no-asan_no-complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_all"
      target-branch: ${{ inputs.target_branch }}
      cdash-track: "Nightly"
      dashboard-build-name: ${AT2_IMAGE}_debug_shared_coverage${{ case(inputs.target_branch == 'develop', '', format('_{0}', inputs.target_branch)) }}
      max-cores-allowed: 29
      num-concurrent-tests: 16
      extra-pr-driver-args: --extra-configure-args=-D;CTEST_TEST_TIMEOUT=1200

  cxx23:
    if: ${{ github.repository == 'trilinos/Trilinos' }}
    uses: ./.github/workflows/ci.yml
    with:
      target-runner-labels: "['self-hosted', 'clang-19.1.7-openmpi-4.1.6', '20260903']"
      image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi9-clang-19.1.7-openmpi-4.1.6:20260903
      genconfig-string: "rhel_clang-openmpi_release-debug_shared_no-kokkos-arch_no-asan_no-complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_all"
      target-branch: ${{ inputs.target_branch }}
      cdash-track: "Nightly"
      dashboard-build-name: ${AT2_IMAGE}_release-debug_shared_cxx23${{ case(inputs.target_branch == 'develop', '', format('_{0}', inputs.target_branch)) }}
      max-cores-allowed: 29
      num-concurrent-tests: 16
      extra-pr-driver-args: --extra-configure-args=-D;CMAKE_CXX_STANDARD=23

  deprecated_off:
    if: ${{ github.repository == 'trilinos/Trilinos' }}
    uses: ./.github/workflows/ci.yml
    with:
      target-runner-labels: "['self-hosted', 'clang-19.1.7-openmpi-4.1.6', '20260903']"
      image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi9-clang-19.1.7-openmpi-4.1.6:20260903
      genconfig-string: "rhel_clang-openmpi_release-debug_shared_no-kokkos-arch_no-asan_no-complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-off_all"
      target-branch: ${{ inputs.target_branch }}
      cdash-track: "Nightly"
      dashboard-build-name: ${AT2_IMAGE}_release-debug_shared_deprecated_off${{ case(inputs.target_branch == 'develop', '', format('_{0}', inputs.target_branch)) }}
      max-cores-allowed: 29
      num-concurrent-tests: 16

  experimental:
    if: ${{ github.repository == 'trilinos/Trilinos' }}
    uses: ./.github/workflows/ci.yml
    with:
      target-runner-labels: "['self-hosted', 'clang-19.1.7-openmpi-4.1.6', '20260903']"
      image: registry-ex.sandia.gov/trilinos-project/trilinos-containers/production/ubi9-clang-19.1.7-openmpi-4.1.6:20260903
      genconfig-string: "rhel_clang-openmpi_release-debug_shared_no-kokkos-arch_no-asan_no-complex_no-fpic_mpi_no-pt_no-rdc_no-uvm_deprecated-on_all"
      target-branch: ${{ inputs.target_branch }}
      cdash-track: "Nightly"
      dashboard-build-name: ${AT2_IMAGE}_release-debug_shared_experimental${{ case(inputs.target_branch == 'develop', '', format('_{0}', inputs.target_branch)) }}
      max-cores-allowed: 29
      num-concurrent-tests: 16
      extra-pr-driver-args: --extra-configure-args=-DTpetra_ENABLE_Experimental=ON;-DAmesos2_ENABLE_Experimental=ON;-DBelos_ENABLE_Experimental=ON;-DIfpack2_ENABLE_Experimental=ON;-DXpetra_ENABLE_Experimental=ON;-DMueLu_ENABLE_Experimental=ON;-DStokhos_ENABLE_Experimental=ON;-DZoltan2Core_ENABLE_Experimental=ON
